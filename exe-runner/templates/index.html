<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EXE Runner</title>
<style>
  :root { --bg:#0e1117; --panel:#161b22; --line:#2a313c; --text:#e6edf3; --dim:#8b949e; --accent:#4f9dff; --bad:#ff6b6b; --good:#3fb950; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:12px; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0; }
  header .tag { font-size:12px; color:var(--dim); }
  main { display:grid; grid-template-columns:320px 1fr; gap:16px; padding:16px; height:calc(100vh - 56px); }
  aside { display:flex; flex-direction:column; gap:14px; overflow:auto; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:0 0 10px; }
  #drop { border:2px dashed var(--line); border-radius:8px; padding:22px 10px; text-align:center; color:var(--dim); cursor:pointer; transition:.15s; }
  #drop.over { border-color:var(--accent); color:var(--text); }
  #drop b { color:var(--text); }
  progress { width:100%; height:6px; margin-top:8px; display:none; }
  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; align-items:center; gap:6px; padding:7px 0; border-top:1px solid var(--line); }
  li:first-child { border-top:0; }
  li .n { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  li .n small { color:var(--dim); }
  li.running .n { color:var(--good); }
  button { background:#21262d; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger:hover { border-color:var(--bad); color:var(--bad); }
  pre { margin:0; max-height:180px; overflow:auto; font-size:11px; color:var(--dim); white-space:pre-wrap; }
  .screen { display:flex; flex-direction:column; gap:8px; min-height:0; }
  .bar { display:flex; gap:8px; align-items:center; color:var(--dim); }
  .bar .sp { flex:1; }
  iframe { flex:1; width:100%; border:1px solid var(--line); border-radius:10px; background:#000; }
  .msg { color:var(--bad); font-size:12px; margin-top:6px; min-height:1em; }
  a { color:var(--accent); }
  @media (max-width:800px){ main{ grid-template-columns:1fr; height:auto; } iframe{ height:60vh; } }
</style>
</head>
<body>
<header>
  <h1>🪟 EXE Runner</h1>
  <span class="tag">Windows games via Wine, streamed to your browser</span>
</header>
<main>
  <aside>
    <div class="card">
      <h2>Upload</h2>
      <div id="drop"><b>Drop a .exe or .zip here</b><br>or click to choose<br><small>Zip the whole game folder if it has DLLs / data files</small></div>
      <input id="file" type="file" accept=".exe,.zip" hidden>
      <progress id="prog" max="100" value="0"></progress>
      <div class="msg" id="msg"></div>
    </div>
    <div class="card">
      <h2>Games</h2>
      <ul id="list"><li><span class="n"><small>Nothing uploaded yet</small></span></li></ul>
    </div>
    <div class="card">
      <h2>Wine log <button style="float:right;padding:1px 8px" onclick="loadLog()">↻</button></h2>
      <pre id="log"></pre>
    </div>
  </aside>
  <section class="screen">
    <div class="bar">
      <span id="status">Idle</span><span class="sp"></span>
      <button class="danger" onclick="stopGame()">■ Stop</button>
      <button onclick="reloadScreen()">Reconnect screen</button>
      <a id="newtab" target="_blank">Open screen in new tab ↗</a>
    </div>
    <iframe id="screen" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
  </section>
</main>
<script>
const VNC_PORT = {{ vnc_port }};
// On Codespaces each port gets its own hostname: <name>-8080.app.github.dev -> <name>-6080.app.github.dev
function portUrl(port, path) {
  const h = location.hostname;
  const m = h.match(/^(.*)-(\d+)(\.(?:preview\.)?app\.github\.dev)$/);
  if (m) return `${location.protocol}//${m[1]}-${port}${m[3]}${path}`;
  return `${location.protocol}//${h}:${port}${path}`;
}
const SCREEN_URL = portUrl(VNC_PORT, "/vnc.html?autoconnect=1&resize=scale&reconnect=1&reconnect_delay=1500");
const $ = id => document.getElementById(id);
$("newtab").href = SCREEN_URL;
function reloadScreen(){ $("screen").src = SCREEN_URL; }
reloadScreen();

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

function render(games, running) {
  const ul = $("list");
  $("status").textContent = running ? "▶ Running: " + running : "Idle";
  if (!games.length) { ul.innerHTML = '<li><span class="n"><small>Nothing uploaded yet</small></span></li>'; return; }
  ul.innerHTML = "";
  for (const g of games) {
    const li = document.createElement("li");
    if (g.path === running) li.className = "running";
    li.innerHTML = `<span class="n" title="${g.path}">${g.path}<br><small>${g.size_mb} MB ${g.hint ? "· " + g.hint : ""}</small></span>`;
    const play = document.createElement("button"); play.className = "primary"; play.textContent = "▶";
    play.onclick = () => runGame(g.path);
    const del = document.createElement("button"); del.className = "danger"; del.textContent = "🗑";
    del.title = "Delete this game's whole folder";
    del.onclick = async () => { if (confirm("Delete " + g.path.split("/")[0] + "?")) { await api("/api/delete", {path:g.path}); refresh(); } };
    li.append(play, del); ul.append(li);
  }
}
async function refresh(){ const j = await api("/api/games"); render(j.games, j.running); }
async function runGame(path){
  $("msg").textContent = "";
  try { await api("/api/run", {path}); refresh(); setTimeout(loadLog, 3000); }
  catch(e){ $("msg").textContent = e.message; }
}
async function stopGame(){ await api("/api/stop", {}); refresh(); }
async function loadLog(){ const j = await api("/api/log"); $("log").textContent = j.log || "(empty)"; }

function upload(file) {
  $("msg").textContent = "";
  const fd = new FormData(); fd.append("file", file);
  const xhr = new XMLHttpRequest();
  $("prog").style.display = "block";
  xhr.upload.onprogress = e => { if (e.lengthComputable) $("prog").value = e.loaded / e.total * 100; };
  xhr.onload = () => {
    $("prog").style.display = "none";
    let j = {}; try { j = JSON.parse(xhr.responseText); } catch {}
    if (xhr.status !== 200) $("msg").textContent = j.error || "Upload failed (" + xhr.status + ")";
    refresh();
  };
  xhr.onerror = () => { $("prog").style.display = "none"; $("msg").textContent = "Upload failed"; };
  xhr.open("POST", "/api/upload"); xhr.send(fd);
}
const drop = $("drop");
drop.onclick = () => $("file").click();
$("file").onchange = e => e.target.files[0] && upload(e.target.files[0]);
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); e.dataTransfer.files[0] && upload(e.dataTransfer.files[0]); };

refresh(); loadLog(); setInterval(refresh, 5000);
</script>
</body>
</html>
